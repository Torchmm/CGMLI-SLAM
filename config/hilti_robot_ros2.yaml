cgmli_slam:
  ros__parameters:
    # One topic per calibration entry, in the same order as the estimator YAML.
    camera_topics:
      - /oak_cam_front/left/image_raw
      - /oak_cam_left/left/image_raw
      - /oak_cam_rear/left/image_raw
      - /oak_cam_right/left/image_raw
    imu_topic: /imu/data
    odom_topic: odom
    world_frame: odom
    imu_frame: imu_link
    camera_queue_size: 8
